<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CartShare - Login</title>
  <link rel="icon" href="assets/icons/favicon.ico" />
  <!-- Bootstrap CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-light">

  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-6 col-lg-5">

        <div class="card shadow-lg p-4">
          <!-- Logo -->
          <div class="text-center mb-3">
            <img src="assets/cartshare_image.png" alt="CartShare Logo" width="80" />
            <h2 class="mt-2 fw-bold text-primary">CartShare</h2>
            <p class="text-muted small">Collaborative Shopping Made Easy</p>
          </div>

          <!-- Step 1: Name -->
          <div id="step-name">
            <label class="form-label fw-semibold">Your Name</label>
            <input
              type="text"
              id="userName"
              class="form-control mb-3"
              placeholder="Enter your name"required
            />
            <button class="btn btn-primary w-100" onclick="goToRoomStep()">
              Continue
            </button>
          </div>

          <!-- Step 2: Create or Join Room -->
          <div id="step-room" class="d-none">
            <p class="text-muted small mb-2">
              Hi, <span id="displayName" class="fw-bold"></span>!
            </p>

            <!-- Create Room -->
            <button class="btn btn-success w-100 mb-3" onclick="createRoom()">
              ➕ Create New Room
            </button>

            <div class="text-center text-muted small mb-2">— OR —</div>

            <!-- Join Room -->
            <label class="form-label fw-semibold">Join with Room Code</label>
            <div class="input-group mb-3">
              <input
                type="text"
                id="roomCodeInput"
                class="form-control text-uppercase"
                placeholder="e.g. ABC123"
                maxlength="6"
              />
              <button class="btn btn-outline-primary" onclick="joinRoom()">
                Join
              </button>
            </div>

            <p id="roomError" class="text-danger small"></p>
          </div>

        </div>

        <p class="text-center text-muted small mt-3">
          &copy; 2025 CartShare | Internship Studio Project
        </p>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/room.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
